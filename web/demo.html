<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudari · A little otter. A little better day.</title><link rel="stylesheet" href="../renderer/style.css"><style>body{background:#eaf0e9;padding:28px;overflow:auto;display:grid;grid-template-columns:minmax(280px,400px) minmax(360px,1fr);gap:24px;align-items:start}@media(max-width:800px){body{display:flex;flex-direction:column;padding:20px}#stage{width:100%!important;height:500px!important;position:relative!important;top:0!important}.demo-controls{max-width:none!important;width:100%}}.demo-controls{max-width:400px;position:relative;z-index:2}.demo-controls h1{font-size:36px;letter-spacing:-1px;margin:8px 0}.demo-controls p{font-size:13px;line-height:1.7;margin-bottom:20px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.demo-controls label{display:flex;justify-content:space-between;gap:10px;margin:12px 0;align-items:center}.demo-controls select{max-width:55%}.demo-controls textarea{padding:12px;min-height:90px;width:100%;border:1px solid #cdd8cd;border-radius:12px;background:#fff}.scroller{height:100px;overflow:auto;padding:12px;background:#fff;border-radius:12px;margin:12px 0}.demo-controls a{color:#416d5d}#stage{position:sticky;top:20px;height:calc(100vh - 56px);min-height:450px;pointer-events:none;z-index:1}#petbox{position:absolute;pointer-events:none;width:360px;height:450px}</style></head><body><main class="demo-controls"><div class="eyebrow">SUDARI · PLAYGROUND</div><h1>A little otter.<br>A little better day.</h1><p>A pixel river otter for your desktop. Try the shell timer, type a little, or give your new friend a shrimp.</p><div class="btns"><button class="ui-button" data-cmd="wave">👋 <span data-i18n="wave"></span></button><button class="ui-button" data-cmd="love">💗 <span data-i18n="love"></span></button><button class="ui-button" data-cmd="snack">🦐 <span data-i18n="snack"></span></button><button class="ui-button" data-cmd="crack">🐚 <span data-i18n="crack"></span></button><button class="ui-button" data-cmd="stretch">🙆 <span data-i18n="stretch"></span></button><button class="ui-button" data-cmd="water">💧 <span data-i18n="water"></span></button><button class="ui-button" data-cmd="float">🌊 <span data-i18n="float"></span></button><button class="ui-button" data-cmd="fireworks">✨ <span data-i18n="fireworks"></span></button><button class="ui-button" data-cmd="timer-panel">⏱ <span data-i18n="timer"></span></button></div><label>🌐 <span data-i18n="language"></span><select id="language"></select></label><label>↔ <span data-i18n="size"></span><select id="scale"><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>🎨 <span data-i18n="color"></span><input type="color" id="color" value="#62504c"></label><label>✿ <span data-i18n="pattern"></span><select id="pattern"><option value="plain" data-i18n="plain"></option><option value="spots" data-i18n="spots"></option><option value="stripes" data-i18n="stripes"></option><option value="blaze" data-i18n="blaze"></option></select></label><label>♡ <span data-i18n="name"></span><input id="name" maxlength="32"></label><textarea placeholder="Type here to see those little paws at work…"></textarea><div class="scroller">Scroll for a shell surprise ↓<br>·<br>·<br>·<br>·<br>·<br>·<br>·<br>🐚</div><div class="btns"><button class="ui-button" id="ai-think">AI · Thinking</button><button class="ui-button" id="ai-done">AI · Done</button></div><p><a href="../renderer/settings.html">⚙ Settings preview</a> · <a href="../renderer/welcome.html">🌐 First launch</a> · <a href="https://github.com/seojaeohcode/SUDARI">GitHub ↗</a></p></main><div id="stage"><div id="petbox"><div id="pin" class="pin"></div><div id="bubble" class="bubble" role="status"></div>
<button id="timer" class="timer" data-i18n-title="timer"><span class="shell"></span></button>
<div id="timerpanel" class="tpanel" role="group" data-i18n-title="timer"><div class="tp-title">🐚 <span data-i18n="timer"></span></div><div class="tp-row"><span data-i18n="focus"></span><button data-k="focusMin" data-d="-5" aria-label="− focus">−</button><b id="tp-focus"></b><button data-k="focusMin" data-d="5" aria-label="+ focus">+</button></div><div class="tp-row"><span data-i18n="break"></span><button data-k="breakMin" data-d="-1" aria-label="− break">−</button><b id="tp-break"></b><button data-k="breakMin" data-d="1" aria-label="+ break">+</button></div><div class="tp-row"><span data-i18n="rounds"></span><button data-k="rounds" data-d="-1" aria-label="− rounds">−</button><b id="tp-rounds"></b><button data-k="rounds" data-d="1" aria-label="+ rounds">+</button></div><div class="tp-actions"><button id="tp-start" class="primary" data-i18n="start"></button><button id="tp-stop">⏹ <span data-i18n="stop"></span></button><button id="tp-close">× <span data-i18n="close"></span></button></div></div><canvas id="pet"></canvas></div></div><script src="../assets/atlas.js"></script><script src="../renderer/locales.js"></script><script src="../renderer/i18n.js"></script><script src="../renderer/preferences.js"></script><script src="../renderer/sprite.js"></script><script src="../renderer/audio.js"></script><script src="../renderer/layout.js"></script><script src="../renderer/pet.js"></script>  <script>
  /* 웹 데모용 브리지 — Electron 창 대신 페이지 안의 div를 움직인다. */
  (function (g) {
    var box = document.getElementById('petbox'),stage=document.getElementById('stage');
    var pos = { x: window.innerWidth - 340, y: window.innerHeight - 310 };
    var cur = { x: -99999, y: -99999 };
    var h = { key: [], wheel: [], agent: [], command: [], config: [] };
    function place() { box.style.left = pos.x + 'px'; box.style.top = pos.y + 'px'; }
    place();

    window.addEventListener('mousemove', function (e) { var r=stage.getBoundingClientRect();cur.x = e.clientX-r.left; cur.y = e.clientY-r.top; });
    window.addEventListener('keydown', function () { h.key.forEach(function (f) { f(); }); });
    window.addEventListener('wheel', function (e) {
      h.wheel.forEach(function (f) { f(e.deltaY || 120); });
    }, { passive: true });

    var cfg = {};
    try { cfg = JSON.parse(localStorage.getItem('sudari-v2') || '{}'); } catch (e) { cfg = {}; }

    cfg = g.Sudari.preferences.normalize(Object.assign({},cfg,{languageChosen:true}));
    g.Sudari.bridge = {
      isElectron: false,
      onKey: function (c) { h.key.push(c); },
      onWheel: function (c) { h.wheel.push(c); },
      onAgent: function (c) { h.agent.push(c); },
      onCommand: function (c) { h.command.push(c); },
      onConfig: function (c) { h.config.push(c); },
      getConfig: function () { return cfg; },
      saveConfig: function (c) { cfg = c; localStorage.setItem('sudari-v2', JSON.stringify(c)); },
      cursorGlobal: function () { return cur; },
      cursorLocal: function () { return { x: cur.x - pos.x, y: cur.y - pos.y }; },
      petPos: function () { return pos; },
      movePet: function (x, y) { pos.x = x; pos.y = y; place(); },
      resizePet: function (scale) {
        var next = g.Sudari.layout.bounds({ x: pos.x, y: pos.y,
          width: box.clientWidth, height: box.clientHeight }, scale,
          this.workArea(), !!cfg.peek);
        pos.x = next.x; pos.y = next.y;
        box.style.width = next.width + 'px'; box.style.height = next.height + 'px';
        place();
        if (g.sudariPet) g.sudariPet.resize();
      },
      workArea: function () { return { x: 0, y: 0, width: stage.clientWidth, height: stage.clientHeight }; },
      setInteractive: function (b) { box.querySelector('canvas').style.pointerEvents=b?'auto':'none'; },
      contextMenu: function () { h.command.forEach(function (f) { f('wave'); }); },
      _emit: function (kind, a, b) { h[kind].forEach(function (f) { f(a, b); }); }
    };
    g.SUDARI_ASSET_DIR = '../assets';
  })(window);
  </script>
  <script src="../renderer/boot.js"></script>
  <script>
  /* 데모 컨트롤 배선 */
  window.addEventListener('load', function () {
    var B = window.Sudari.bridge;
    document.querySelectorAll('[data-cmd]').forEach(function (b) {
      b.addEventListener('click', function () { B._emit('command', b.dataset.cmd); });
    });
    document.getElementById('ai-think').addEventListener('click', function () {
      B._emit('agent', { state: 'thinking' });
    });
    document.getElementById('ai-done').addEventListener('click', function () {
      B._emit('agent', { state: 'done', text: Sudari.i18n.t('done') });
    });
    function patch(p) {
      var pet = window.sudariPet;
      if (!pet) return;
      var next = window.Sudari.Pet.deepMerge(pet.cfg, p);
      B.saveConfig(next);
      pet.applyConfig(next);
    }
    Sudari.i18n.languages.forEach(function(l){var o=document.createElement('option');o.value=l.id;o.textContent=l.name;document.getElementById('language').appendChild(o);});
    document.getElementById('language').onchange=function(){patch({language:this.value});};
    window.addEventListener('resize',function(){if(window.sudariPet)B.resizePet(sudariPet.cfg.scale);});
    document.getElementById('color').addEventListener('input', function () {
      patch({ baseColor: this.value });
    });
    document.querySelectorAll('[data-color]').forEach(function (b) {
      b.addEventListener('click', function () {
        document.getElementById('color').value = b.dataset.color;
        patch({ baseColor: b.dataset.color });
      });
    });
    document.getElementById('pattern').addEventListener('change', function () {
      var pet = window.sudariPet;
      var next = window.Sudari.Pet.deepMerge(pet.cfg, { pattern: this.value });
      B.saveConfig(next);
      pet.applyConfig(next);   // 무늬가 바뀌면 applyConfig가 시트를 다시 읽는다
    });
    document.getElementById('scale').addEventListener('change', function () {
      patch({ scale: parseInt(this.value, 10) });
    });
    document.getElementById('name').addEventListener('input', function () {
      patch({ name: this.value });
    });
  });
  </script>
</body>
</html>
