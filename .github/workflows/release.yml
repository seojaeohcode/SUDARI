name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: First launch and installer language
        run: |
          npx electron tools/smoke-welcome.js
          npx electron tools/smoke-welcome.js --installer
      - name: Electron regression at standard density
        run: npm run test:smoke -- --force-device-scale-factor=1
      - name: Electron regression at Retina density
        run: npm run test:smoke -- --force-device-scale-factor=2
      - name: Package for this CPU
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
      - name: Inspect packaged resources
        run: node tools/check-package.js ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Audit the previous published Mac signature
        if: matrix.platform == 'mac' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.1 --pattern 'Sudari-2.0.1-mac-${{ matrix.arch }}.zip' --dir legacy
          node tools/check-mac-distribution.js --audit legacy/Sudari-2.0.1-mac-${{ matrix.arch }}.zip
      - name: Verify Mac installers and launch their actual apps
        if: matrix.platform == 'mac'
        run: node tools/check-mac-distribution.js
      - uses: actions/upload-artifact@v4
        with:
          name: sudari-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*-mac-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sudari-*
          merge-multiple: true
          path: release-assets
      - name: Verify version and create checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: "SUDARI ${{ github.ref_name }} · A little otter, in your language 🦦"
          body_path: docs/releases/2.0.1.md
          fail_on_unmatched_files: true
          files: release-assets/*
