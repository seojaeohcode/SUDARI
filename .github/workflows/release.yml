# 태그(v*)를 푸시하면 Windows 설치파일/포터블 exe를 빌드해 GitHub Release에 올린다.
#   git tag v0.1.0 && git push --tags
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 업로드는 아래 action-gh-release 가 한다. electron-builder 의 태그 감지 자동 배포는 끈다.
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
