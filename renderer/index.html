<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'"
    />
    <title>Sudari</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pet-window">
    <div id="pin" class="pin"></div>
    <div id="bubble" class="bubble" role="status"></div>
    <button id="timer" class="timer" data-i18n-title="timer">
      <span class="shell"></span>
    </button>
    <div id="timerpanel" class="tpanel" role="group" data-i18n-title="timer">
      <div class="tp-title">🐚 <span data-i18n="timer"></span></div>
      <div class="tp-row">
        <span data-i18n="focus"></span
        ><button data-k="focusMin" data-d="-5" aria-label="− focus">−</button
        ><b id="tp-focus"></b
        ><button data-k="focusMin" data-d="5" aria-label="+ focus">+</button>
      </div>
      <div class="tp-row">
        <span data-i18n="break"></span
        ><button data-k="breakMin" data-d="-1" aria-label="− break">−</button
        ><b id="tp-break"></b
        ><button data-k="breakMin" data-d="1" aria-label="+ break">+</button>
      </div>
      <div class="tp-row">
        <span data-i18n="rounds"></span
        ><button data-k="rounds" data-d="-1" aria-label="− rounds">−</button
        ><b id="tp-rounds"></b
        ><button data-k="rounds" data-d="1" aria-label="+ rounds">+</button>
      </div>
      <div class="tp-actions">
        <button id="tp-start" class="primary" data-i18n="start"></button
        ><button id="tp-stop">⏹ <span data-i18n="stop"></span></button
        ><button id="tp-close">× <span data-i18n="close"></span></button>
      </div>
    </div>
    <canvas id="pet"></canvas>
    <script src="../assets/atlas.js"></script>
    <script src="locales.js"></script>
    <script src="i18n.js"></script>
    <script src="preferences.js"></script>
    <script src="sprite.js"></script>
    <script src="audio.js"></script>
    <script src="layout.js"></script>
    <script src="pet.js"></script>
    <script src="bridge-electron.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
