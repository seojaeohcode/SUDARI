<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Sudari</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="settings">
    <main class="page">
      <header class="masthead">
        <div>
          <div class="eyebrow">SUDARI · 2.0</div>
          <h1>⚙ <span data-i18n="settings"></span></h1>
          <p class="muted" data-i18n="welcome"></p>
          <p class="saved">✓ <span data-i18n="saved"></span></p>
        </div>
        <canvas class="mascot" id="prev" width="240" height="240"></canvas>
      </header>
      <section>
        <h2>🌐 <span data-i18n="language"></span></h2>
        <div class="setting-row">
          <label for="language"
            >🌐 <span data-i18n="language"></span
            ><span class="hint" data-i18n="languageHint"></span></label
          ><select id="language"></select>
        </div>
      </section>
      <section>
        <h2>🦦 <span data-i18n="appearance"></span></h2>
        <div class="setting-row">
          <label for="name"
            >♡ <span data-i18n="name"></span
            ><span class="hint" data-i18n="nameHint"></span></label
          ><input id="name" type="text" maxlength="32" />
        </div>
        <div class="setting-row">
          <label for="baseColor">🎨 <span data-i18n="color"></span></label
          ><input id="baseColor" type="color" />
        </div>
        <div id="swatches" class="swatches"></div>
        <div class="setting-row">
          <label for="pattern">✿ <span data-i18n="pattern"></span></label
          ><select id="pattern"></select>
        </div>
        <div class="setting-row">
          <label for="scale"
            >↔ <span data-i18n="size"></span
            ><span class="hint" data-i18n="fitHint"></span></label
          ><select id="scale"></select>
        </div>
      </section>
      <section>
        <h2>✨ <span data-i18n="reactions"></span></h2>
        <div class="setting-row">
          <label for="r-mouse">↖ <span data-i18n="mouse"></span></label
          ><input id="r-mouse" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="r-keyboard">⌨ <span data-i18n="keyboard"></span></label
          ><input id="r-keyboard" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="r-scroll">↕ <span data-i18n="scroll"></span></label
          ><input id="r-scroll" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="r-pet">♡ <span data-i18n="pet"></span></label
          ><input id="r-pet" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="volume">♪ <span data-i18n="volume"></span></label
          ><input id="volume" type="range" min="0" max="1" step="0.05" />
        </div>
        <div class="setting-row">
          <label for="muted">🔇 <span data-i18n="muted"></span></label
          ><input id="muted" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="sleepAfterMin">☾ <span data-i18n="sleep"></span></label
          ><input id="sleepAfterMin" type="number" min="1" max="120" />
        </div>
        <div class="setting-row">
          <label for="ambient-on">✨ <span data-i18n="ambient"></span></label
          ><input id="ambient-on" type="checkbox" />
        </div>
      </section>
      <section>
        <h2>🐚 <span data-i18n="timer"></span></h2>
        <div class="setting-row">
          <label for="pomo-on">⏱ <span data-i18n="timer"></span></label
          ><input id="pomo-on" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="pomo-focus">◎ <span data-i18n="focus"></span><span class="hint" data-i18n="minutes"></span></label
          ><input id="pomo-focus" type="number" min="5" max="180" />
        </div>
        <div class="setting-row">
          <label for="pomo-break">☕ <span data-i18n="break"></span><span class="hint" data-i18n="minutes"></span></label
          ><input id="pomo-break" type="number" min="1" max="60" />
        </div>
        <div class="setting-row">
          <label for="pomo-rounds">↻ <span data-i18n="rounds"></span></label
          ><input id="pomo-rounds" type="number" min="1" max="12" />
        </div>
      </section>
      <section>
        <h2>🔔 <span data-i18n="reminders"></span></h2>
        <div class="setting-row">
          <label for="stretch-on">🙆 <span data-i18n="stretch"></span></label
          ><input id="stretch-on" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="stretch-min">◷ <span data-i18n="interval"></span></label
          ><input id="stretch-min" type="number" min="5" max="600" />
        </div>
        <div class="setting-row">
          <label for="water-on">💧 <span data-i18n="water"></span></label
          ><input id="water-on" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="water-min">◷ <span data-i18n="interval"></span></label
          ><input id="water-min" type="number" min="5" max="600" />
        </div>
        <div class="setting-row">
          <label for="aff-on">💗 <span data-i18n="affection"></span></label
          ><input id="aff-on" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="aff-min">◷ <span data-i18n="interval"></span></label
          ><input id="aff-min" type="number" min="5" max="600" />
        </div>
        <div class="setting-row">
          <label for="meal-breakfast"
            >🌅 <span data-i18n="breakfast"></span></label
          ><input id="meal-breakfast" type="time" />
        </div>
        <div class="setting-row">
          <label for="meal-lunch">☀ <span data-i18n="lunch"></span></label
          ><input id="meal-lunch" type="time" />
        </div>
        <div class="setting-row">
          <label for="meal-dinner">🌙 <span data-i18n="dinner"></span></label
          ><input id="meal-dinner" type="time" />
        </div>
        <p class="hint" data-i18n="mealHint"></p>
      </section>
      <section>
        <h2>💬 <span data-i18n="messages"></span></h2>
        <div class="setting-row">
          <label for="pin">📌 <span data-i18n="pin"></span></label
          ><input id="pin" type="text" maxlength="120" />
        </div>
        <div id="reminders"></div>
        <div class="rem">
          <input
            id="rem-time"
            type="time"
            value="14:30"
            data-i18n-title="reminders"
          /><input
            id="rem-msg"
            type="text"
            maxlength="120"
            data-i18n-placeholder="reminderText"
          /><button id="rem-add" class="ui-button">
            ＋ <span data-i18n="add"></span>
          </button>
        </div>
      </section>
      <section>
        <h2>⚙ <span data-i18n="system"></span></h2>
        <div class="setting-row">
          <label for="launchAtLogin"
            >↗ <span data-i18n="launchAtLogin"></span></label
          ><input id="launchAtLogin" type="checkbox" />
        </div>
        <div class="setting-row">
          <label for="peek">🫣 <span data-i18n="peek"></span></label
          ><input id="peek" type="checkbox" />
        </div>
      </section>
      <footer class="footer">
        <button id="reset" class="ui-button">
          ↺ <span data-i18n="reset"></span></button
        ><button id="hi" class="ui-button">
          👋 <span data-i18n="wave"></span></button
        ><button id="close" class="ui-button primary">
          ✓ <span data-i18n="close"></span>
        </button>
      </footer>
    </main>
    <script src="../assets/atlas.js"></script>
    <script src="locales.js"></script>
    <script src="i18n.js"></script>
    <script src="preferences.js"></script>
    <script src="sprite.js"></script>
    <script src="preview-api.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
